[workspace]
resolver = "2"
members = ["crates/*"]

[profile.dev]
debug = true
lto = "off"
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
opt-level = 3
panic = "abort"

[workspace.dependencies]
auth = { path = "crates/auth" }
config = { path = "crates/config" }
crypto = { path = "crates/crypto" }
errors = { path = "crates/errors" }
macros = { path = "crates/macros" }
models = { path = "crates/models" }
sample = { path = "crates/sample" }

aliri_braid = "=0.4.0"
argon2 = "=0.5.3"
axum = { version = "=0.8.4", features = ["macros", "ws"] }
axum-extra = { version = "=0.10.1", features = ["typed-header"] }
axum-prometheus = "=0.9.0"
axum-test = "=18.1.0"
base64 = "=0.22.1"
bitflags = "=2.9.4"
chrono = { version = "=0.4.42", features = ["serde"] }
criterion = { version = "=0.7.0", features = ["html_reports"] }
darling = "=0.21.3"
derive_more = { version = "=2.0.1", features = ["full"] }
diesel = { version = "=2.3.2", features = [
    "chrono",
    "postgres",
    "r2d2",
    "uuid",
    "serde_json",
    "network-address",
] }
diesel_migrations = { version = "=2.3.0", features = ["postgres"] }
dotenvy = "=0.15.7"
fake = { version = "=4.4.0", features = ["derive", "chrono", "uuid"] }
http = "=1.3.1"
http-body-util = "=0.1.3"
ipnetwork = { version = "=0.21.1", features = ["serde"] }
jsonwebtoken = "=9.3.1"
lazy_static = "=1.5.0"
metrics = "=0.24.2"
mockall = "=0.13.1"
openssl-probe = "=0.1.6"
pretty_assertions = "=1.4.1"
proc-macro-crate = "=3.4.0"
proc-macro2 = "=1.0.101"
proptest = "=1.8.0"
pyroscope = "=0.5.8"
pyroscope_pprofrs = "=0.2.10"
quote = "=1.0.40"
rand = "=0.9.2"
rand_core = { version = "=0.5.1", features = ["std", "getrandom"] }
rayon = "=1.11.0"
rstest = "=0.26.1"
serde = { version = "=1.0.221", features = ["derive"] }
serde-binary = "=0.5.0"
serde_json = "=1.0.145"
serial_test = "=3.2.0"
strum = { version = "=0.27.2", features = ["derive"] }
syn = "=2.0.106"
thiserror = "=2.0.16"
swc_common = "=14.0.4"
tokio = { version = "=1.47.1", features = ["full"] }
tokio-cron-scheduler = "=0.14.0"
tower-http = { version = "=0.6.6", features = ["full"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
ts-rs = { version = "=11.0.1", features = [
    "format",
    "uuid-impl",
    "heapless-impl",
    "chrono-impl",
] }
utoipa = { version = "=5.4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum"] }
utoipauto = "=0.2.0"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }
validator = { version = "=0.20.0", features = ["derive"] }

[package]
name = "server"
version = "0.0.0"
edition = "2024"

[lib]
doctest = false

[[bin]]
name = "server"
test = false

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[dev-dependencies]
axum-test.workspace = true
criterion.workspace = true
fake.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
rstest.workspace = true
serial_test.workspace = true

[dependencies]
auth.workspace = true
config.workspace = true
crypto.workspace = true
errors.workspace = true
macros.workspace = true
models.workspace = true
sample.workspace = true

aliri_braid.workspace = true
axum-extra.workspace = true
axum-prometheus.workspace = true
axum.workspace = true
bitflags.workspace = true
chrono.workspace = true
http-body-util.workspace = true
http.workspace = true
ipnetwork.workspace = true
metrics.workspace = true
openssl-probe.workspace = true
pyroscope.workspace = true
pyroscope_pprofrs.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
tokio-cron-scheduler.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
ts-rs.workspace = true
utoipa-swagger-ui.workspace = true
utoipa.workspace = true
utoipauto.workspace = true
uuid.workspace = true
validator.workspace = true
