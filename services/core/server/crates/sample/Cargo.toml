[package]
name = "sample"
version = "0.0.0"
edition = "2024"

[package.metadata]
flux = { enabled = true, cache = true }

[features]
fuzz = ["afl", "arbitrary"]

[dependencies]
afl = { workspace = true, optional = true }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
rstest.workspace = true
proptest.workspace = true
pretty_assertions.workspace = true

[target.'cfg(kani_ra)'.dependencies]
kani.workspace = true

[target.'cfg(flux)'.dependencies]
flux-rs.workspace = true
