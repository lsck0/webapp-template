[project]
name = "ai"
version = "0.0.0"
description = "Service for ML features."
authors = []
requires-python = ">=3.13"
dependencies = [
    "black (>=25.1.0,<26.0.0)",
    "fastapi (>=0.115.12,<0.116.0)",
    "flake8 (>=7.2.0,<8.0.0)",
    "flake8-pyproject (>=1.2.3,<2.0.0)",
    "isort (>=6.0.1,<7.0.0)",
    "mypy (>=1.16.0,<2.0.0)",
    "numba (>=0.64.0,<0.65.0)",
    "numpy (>=2.4.2,<3.0.0)",
    "ollama (>=0.6.1,<0.7.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "scikit-tda (>=1.1.1,<2.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "types-tqdm (>=4.67.3.20260205,<5.0.0.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src/" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
strict = true

[tool.flake8]
max-line-length = 120
exclude = [".git", "__pycache__", ".venv"]
