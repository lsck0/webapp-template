load_module modules/ngx_http_modsecurity_module.so;
load_module modules/ngx_http_geoip2_module.so;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity.conf;

    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
        $geoip2_data_country_code country iso_code;
        $geoip2_data_country_name country names en;
        $geoip2_data_city_name city names en;
        $geoip2_data_location_latitude location latitude;
        $geoip2_data_location_longitude location longitude;
    }

    log_format json_analytics escape=json '{'
        '"msec": "$msec", '
        '"connection": "$connection", '
        '"connection_requests": "$connection_requests", '
        '"pid": "$pid", '
        '"request_id": "$request_id", '
        '"request_length": "$request_length", '
        '"remote_addr": "$remote_addr", '
        '"remote_user": "$remote_user", '
        '"remote_port": "$remote_port", '
        '"time_local": "$time_local", '
        '"time_iso8601": "$time_iso8601", '
        '"request": "$request", '
        '"request_uri": "$request_uri", '
        '"args": "$args", '
        '"status": "$status", '
        '"body_bytes_sent": "$body_bytes_sent", '
        '"bytes_sent": "$bytes_sent", '
        '"http_referer": "$http_referer", '
        '"http_user_agent": "$http_user_agent", '
        '"http_x_forwarded_for": "$http_x_forwarded_for", '
        '"http_host": "$http_host", '
        '"server_name": "$server_name", '
        '"request_time": "$request_time", '
        '"upstream": "$upstream_addr", '
        '"upstream_connect_time": "$upstream_connect_time", '
        '"upstream_header_time": "$upstream_header_time", '
        '"upstream_response_time": "$upstream_response_time", '
        '"upstream_response_length": "$upstream_response_length", '
        '"upstream_cache_status": "$upstream_cache_status", '
        '"ssl_protocol": "$ssl_protocol", '
        '"ssl_cipher": "$ssl_cipher", '
        '"scheme": "$scheme", '
        '"request_method": "$request_method", '
        '"server_protocol": "$server_protocol", '
        '"pipe": "$pipe", '
        '"gzip_ratio": "$gzip_ratio", '
        '"http_cf_ray": "$http_cf_ray", '
        '"geoip_country_code": "$geoip2_data_country_code"'
    '}';
    access_log /var/log/nginx/access.log json_analytics;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';

    # headers

    server_tokens off;

    include       mime.types;
    default_type  application/octet-stream;

    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # timeouts and limits

    client_body_timeout 10;
    client_header_timeout 10;
    send_timeout 10;
    keepalive_timeout 10;
    client_max_body_size 1M;

    limit_req_zone $binary_remote_addr zone=rate_limit:50m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:50m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # upgrade 80 -> 443
    server {
        listen 80;
        listen [::]:80;

        return 301 https://$host$request_uri;
    }

    # terminate ssl and forward to anubis
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        ssl_certificate /etc/nginx/ssl/selfsigned.crt;
        ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

        access_log /var/log/nginx/access.log json_analytics;

        limit_req zone=rate_limit burst=100 nodelay;
        limit_conn conn_limit 25;

        if ($request_method !~ ^(OPTIONS|GET|POST|PUT|PATCH|DELETE)$ ) {
            return 444;
        }

        location / {
            proxy_pass http://anubis:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Http-Version $server_protocol;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # anubis sends us here to the main server reverse proxying bewtween client and server
    server {
        listen 8080;

        access_log off;

        location / {
            proxy_pass http://client:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Http-Version $server_protocol;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api {
            proxy_pass http://server:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Http-Version $server_protocol;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # monitoring and other services non public services

    server {
        server_name ~^grafana\..*$;

        listen 80;
        listen [::]:80;

        modsecurity off;
        access_log off;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Http-Version $server_protocol;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        server_name ~^pgweb\..*$;

        listen 80;
        listen [::]:80;

        modsecurity off;
        access_log off;

        location / {
            proxy_pass http://pgweb:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Http-Version $server_protocol;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        server_name ~^minio\..*$;

        listen 80;
        listen [::]:80;

        modsecurity off;
        access_log off;

        location / {
            proxy_pass http://minio:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Http-Version $server_protocol;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # this fixes an error in minio web interface
            proxy_hide_header Content-Security-Policy;
        }
    }

    server {
        server_name ~^postgres\..*$;

        listen 80;
        listen [::]:80;

        modsecurity off;
        access_log off;

        location / {
            proxy_pass http://postgres:5432;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Http-Version $server_protocol;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # healthcheck
    server {
        listen 6666;

        access_log off;

        location /health {
            allow 127.0.0.1;
            deny all;

            return 200;
        }

        location /status {
            stub_status on;
        }
    }
}
