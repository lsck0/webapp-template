scrape_configs:
  - job_name: anubis
    scrape_interval: 15s
    static_configs:
      - targets: ["anubis:9090"]

  - job_name: nginx
    scrape_interval: 15s
    static_configs:
      - targets: ["nginx-metrics:9113"]

  - job_name: server
    scrape_interval: 15s
    metrics_path: /api/metrics
    static_configs:
      - targets: ["server"]

  - job_name: docker
    scrape_interval: 15s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: minio
    scrape_interval: 15s
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]

  - job_name: loki
    scrape_interval: 15s
    static_configs:
      - targets: ["loki"]
