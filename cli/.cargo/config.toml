[registries.crates.io]
protocol = "sparse"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=mold", "-Zthreads=12"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=mold", "-Zthreads=12"]

[target.x86_64-apple-darwin]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=mold", "-Zthreads=12"]
